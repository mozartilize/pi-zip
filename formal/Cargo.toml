[package]
name = "pz-formal"
version = "0.1.0"
edition = "2021"
description = "A small spec language and bounded model checker for pi-zip, with conformance against the real TypeScript implementation"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
